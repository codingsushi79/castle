name: Release

# Push a tag such as v2.1.1 to build Castle for every platform and publish it.
# Installed copies of Castle find the new version through latest.json on the release.
#
# A version with a numeric suffix, such as 2.3.0-1, is a beta: it is published as a
# pre-release, so the stable channel (GitHub's "latest" release) never sees it. The
# beta channel reads latest.json from the `updater-beta` release, which is moved to
# each new release, beta or stable, that is newer than what it holds.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { version } = require('./package.json');
            const [base, beta] = version.split('-');
            // The release notes are this version's section of CHANGELOG.md (Castle shows the same text).
            const log = require('fs').readFileSync('CHANGELOG.md', 'utf8');
            const section = log.split(/^## /m).find((s) => s.split('\n')[0].trim() === version);
            const notes = section ? section.split('\n').slice(1).join('\n').trim() + '\n\n' : '';
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: beta ? `Castle ${base} beta ${beta}` : `Castle ${version}`,
              body: notes + (beta
                ? 'A beta build. Turn on the Beta update channel in Settings, Updates to get these automatically.'
                : 'Download the file for your system below. Installed copies of Castle update themselves.'),
              draft: true,
              prerelease: !!beta,
            });
            // Wasabi's binaries go on every release, so Castle can download one when its bundle lacks it.
            const fs = require('fs');
            for (const name of fs.readdirSync('src-tauri/resources/wasabi')) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: data.id,
                name,
                data: fs.readFileSync(`src-tauri/resources/wasabi/${name}`),
                headers: { 'content-type': 'application/octet-stream' },
              });
            }
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Package types
        id: bundles
        shell: bash
        run: |
          # RPM versions can't contain "-", so a beta (2.3.0-1) skips the .rpm; .deb and AppImage take it.
          version=$(node -p "require('./package.json').version")
          if [[ "${{ matrix.platform }}" == ubuntu* && "$version" == *-* ]]; then
            echo "args=--bundles deb,appimage" >> "$GITHUB_OUTPUT"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Local builds sign with a personal development certificate; CI signs ad hoc.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }} ${{ steps.bundles.outputs.args }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = Number('${{ needs.create-release.outputs.release_id }}');
            const { data: draft } = await github.rest.repos.getRelease({ owner, repo, release_id });
            await github.rest.repos.updateRelease({
              owner, repo, release_id, draft: false,
              make_latest: draft.prerelease ? 'false' : 'true',
            });

            // Move the beta channel to this release if it is newer than what the channel holds.
            const download = async (asset_id) => Buffer.from((await github.rest.repos.getReleaseAsset({
              owner, repo, asset_id, headers: { accept: 'application/octet-stream' },
            })).data);
            const parse = (v) => {
              const [base, pre] = v.replace(/^v/, '').split('-');
              return [...base.split('.').map(Number), pre === undefined ? Infinity : Number(pre)];
            };
            const newer = (a, b) => {
              const x = parse(a), y = parse(b);
              for (let i = 0; i < 4; i++) if (x[i] !== y[i]) return x[i] > y[i];
              return false;
            };
            const { data: assets } = await github.rest.repos.listReleaseAssets({ owner, repo, release_id, per_page: 100 });
            const manifest = assets.find((a) => a.name === 'latest.json');
            if (!manifest) return core.warning('This release has no latest.json; the beta channel was not moved.');
            // tauri-action links each file through releases/latest/download, and "latest" is the newest
            // stable release. For a beta that fetches the stable build, which then fails its signature
            // check (the macOS archives have no version in their names). Pin the links to this release.
            const parsed = JSON.parse((await download(manifest.id)).toString());
            const version = parsed.version;
            for (const p of Object.values(parsed.platforms)) p.url = p.url.replace('/releases/latest/download/', `/releases/download/v${version}/`);
            const fresh = Buffer.from(JSON.stringify(parsed, null, 2));

            let channel;
            try {
              channel = (await github.rest.repos.getReleaseByTag({ owner, repo, tag: 'updater-beta' })).data;
            } catch {
              channel = (await github.rest.repos.createRelease({
                owner, repo, tag_name: 'updater-beta', name: 'Beta update channel',
                body: 'Castle reads the beta update manifest from this release. Download builds from the versioned releases instead.',
                prerelease: true, make_latest: 'false',
              })).data;
            }
            const old = channel.assets.find((a) => a.name === 'latest.json');
            if (old) {
              const current = JSON.parse((await download(old.id)).toString()).version;
              if (!newer(version, current)) return core.info(`The beta channel stays on ${current}.`);
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
            }
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: channel.id, name: 'latest.json', data: fresh,
              headers: { 'content-type': 'application/json' },
            });
            core.info(`The beta channel now offers ${version}.`);
